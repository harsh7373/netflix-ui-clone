                            <path
                                fill="currentColor"
                                fill-rule="evenodd"
                                d="M10.77 5.33 10.5 6 9.34 8.94l-.57 1.44L7.33 14h1.78l.73-1.97h3.58l.74 1.97H16l-3.43-8.67zm-.15 4.6-.24.63h2.51l-1.26-3.35zm-1.1-5.09.1-.19h-3.2V2h-1.5v2.65H.55V6h3.77A11 11 0 0 1 0 10.43c.33.28.81.8 1.05 1.16 1.5-.91 2.85-2.36 3.88-4.02v5.1h1.49V7.52q.6.95 1.33 1.8l.57-1.43a12 12 0 0 1-1.34-1.9h2.09z"
                                clip-rule="evenodd"
                            />
                        </svg>
                        <span id="lang_btn_txt">English</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 16 16">
                            <path
                                fill="currentColor"
                                fill-rule="evenodd"
                                d="M11.6 6.5c.15 0 .22.18.12.28l-3.48 3.48a.33.33 0 0 1-.48 0L4.28 6.78a.17.17 0 0 1 .12-.28z"
                                clip-rule="evenodd"
                            />
                        </svg>
                    </button>

                    <button id="sign_in_btn">Sign In</button>
                </div>
            </nav>

            <div id="hero_image">
                <div id="opacity_box"></div>

                <div id="hero_text_box">
                    <div class="hero_text">Unlimited movies,</div>
                    <div class="hero_text">shows, and more</div>
                    <div class="small_hero_text">Plans start at ₹149. Cancel anytime.</div>
                    <div class="smallest_hero_text">Ready to watch? Enter your email to start your membership.</div>

                    <div id="hero_img_input_and_btn">
                        <div id="email_input_container">
                            <label id="label_for_email" for="email_input">Email address</label>
                            <input type="email" name="" id="email_input" />
                        </div>

                        <button id="trial_btn">Try 14 Days for ₹0</button>
                    </div>

                    <div id="terms_txt">New members only. Terms below.</div>
                </div>
            </div>

            <div id="decorative_line"></div>
            <div id="decorative_glow"></div>
        </header>

        <main>
            <div  id="movie_slider_container">

               <img class="movie_cards" src="" alt="">

               <img class="movie_cards" src="" alt="">
